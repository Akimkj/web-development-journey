<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Tabuada</h1>
        <article id="boxTabuada">
            <form method="post" id="selectNumber">
                <label for="inumberTab">Número: </label>
                <input type="number" name="numberTab" id="iNumberTab">
                <input type="button" value="Gerar tabuada" id="submitButton">
            </form>
            <select name="resultado" id="iresultado" size="10">
                <option>Digite um número acima</option>
            </select>
        </article>
    </main>
    <footer>
        <p>&copy; Mika Marques - Pelo Curso em Vídeo</p>
    </footer>
</body>
</html>
